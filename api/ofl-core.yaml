# The Open Food Log API core: what any Open Food Log server serves. Generated from Lifterclub's
# docs/openapi/v1.yaml, the reference implementation, by make ofl-core: don't edit it by hand.
openapi: 3.1.0
info:
  title: Open Food Log API core
  version: v0
  summary: The routes any Open Food Log server serves over a person's food log.
  description: |
    The REST API any Open Food Log server serves over a person's food log. Meals and foods are Open
    Food Log v0 documents (https://openfoodlog.org/schema/v0/meal.json and food.json), and amounts
    become grams and nutrients by the specification's section 6.

    A server is found from a 401: its WWW-Authenticate header names the OAuth protected resource
    metadata (RFC 9728), which names the authorization server (RFC 8414). Clients use OAuth 2.1 with
    PKCE. Errors are RFC 9457 problem details whose code says what went wrong. Requests that create
    things take an Idempotency-Key header, and a retry with the same key returns the first result with
    Idempotent-Replayed: true. Webhook deliveries are signed in OFL-Signature.

    A server may add routes, fields and limits of its own; clients ignore what they don't know.
    ofl conformance <base-url> checks a server against this document's behaviour.
    Lifterclub (https://api.lifterclub.com) is the reference implementation.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - oauth2: []
tags:
  - name: Webhooks
  - name: Foods
    description: |
      Foods to log meals against. A food is an Open Food Log v0 food: nutrients per 100 g, each key
      ending in its unit, a missing key unknown.
  - name: Meals
    description: |
      What the user ate, as Open Food Log v0 meals (https://openfoodlog.org). Health data: writes
      need consent. A server may leave totals out when the person asked not to see numbers; the meals and their items stay.
paths:
  /v1/webhooks:
    get:
      operationId: listWebhooks
      summary: List this app's webhooks on the account
      description: Without secrets. A webhook belongs to the grant the token came from, so each app sees only its own.
      tags: [Webhooks]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The app's subscriptions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWebhookList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      operationId: createWebhook
      summary: Be told when the log changes
      description: "Subscribes the calling app to changes in this person's food log. Each changed meal becomes one signed POST to `url` carrying the kind of change and the meal's ID, never its content; read the meal afterwards. The `secret` in the response is shown once. Deliveries are signed in `OFL-Signature`: `t=<unix seconds>,v1=<hex HMAC-SHA256 of \"<t>.<body>\">`. Only a connected app can subscribe, not a person's own key. A server says how often it delivers and how many subscriptions an app may hold. Ten failed deliveries in a row pause the subscription; subscribe again to resume."
      tags: [Webhooks]
      security: [{oauth2: ['meals:read']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MealWebhookInput"}
      responses:
        "201":
          description: Subscribed. `Location` names the subscription.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWebhook"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: End a webhook
      tags: [Webhooks]
      security: [{oauth2: ['meals:read']}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/export:
    get:
      operationId: exportLog
      summary: Download the whole log
      description: |
        Every meal in the log, newest first, as an Open Food Log v0 log document
        (https://openfoodlog.org/schema/v0/log.json): the meals, the person's own foods they name,
        and the meals the person deleted, for a server that keeps them. A server may add more of the
        record beside them.
        Only `format=json` is part of this core. A server may limit how often it runs. If it fails part way the connection is cut, so an incomplete file never
        looks finished.
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        "200":
          description: The file, sent as an attachment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OFLExport"}
            text/csv:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/foods:
    get:
      operationId: searchFoods
      summary: Search the food catalogue and the user's own foods
      description: |
        By name or alias, best first: a whole name, then a whole alias, then a name that starts with
        the word ("egg" finds "Egg, whole, raw, fresh"), then the closest by spelling. Retired
        catalogue foods aren't found. An alias may belong to several foods: show the matches and let
        the person choose rather than taking the first.
      tags: [Foods]
      security: [{oauth2: ['meals:read']}]
      parameters:
        - {name: query, in: query, required: true, description: "A food's name or what people call it, e.g. \"hard boiled egg\".", schema: {type: string, minLength: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 25, default: 10}}
      responses:
        "200":
          description: Best matches first.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods:
                    type: array
                    items: {$ref: "#/components/schemas/FoodMatch"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      operationId: createFood
      summary: Make one of the user's own foods
      description: |
        For a food the server's catalogue lacks, typed from its label. Give `nutrients_per_100g`, or a
        label's `nutrients_per_serving` with the `serving` it describes: those are scaled to 100 g,
        and the serving becomes the default portion. `energy_kcal` is required. More than 900 kcal,
        or more than 100 g of protein, fat and carbohydrate, in 100 g is refused as numbers per
        serving typed as per 100 g. It's visible only to this user. If the user already has a food
        by that name, it's returned unchanged (200). A server may limit how many.
      tags: [Foods]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FoodRequest"}
      responses:
        "201":
          description: Made.
          headers:
            Location: {schema: {type: string}, description: The new food's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Food"}
        "200":
          description: The user's existing food with that name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Food"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/meals:
    get:
      operationId: listMeals
      summary: The user's meals on some days, or the meals change feed
      description: |
        Days are YYYY-MM-DD in the user's timezone, inclusive; both default to today. A server may
        limit the span. Earliest first, with each day's totals, unless the
        person asked not to see numbers: then `days` is left out, and the meals and their items stay.

        With `updated_since`, this is the change feed: every meal whose stored record changed at or
        after that time (an edit to the meal or any of its items, a delete or a restore), oldest
        change first, `limit` at a time, with `next_cursor` while `truncated`. `from` and `to` are
        ignored and there are no `days`. `include_deleted=true` adds the meals deleted since then as
        tombstones in `deleted`; a meal restored afterwards comes back in `meals`. `include_deleted`,
        `limit` and `cursor` are only for the feed.
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: updated_since, in: query, description: "An RFC 3339 time: switches to the change feed.", schema: {type: string, format: date-time}}
        - {name: include_deleted, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, description: "`next_cursor` from the previous page of the feed.", schema: {type: string}}
      responses:
        "200":
          description: The meals.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      operationId: createMeal
      summary: Log a meal
      description: |
        Each item names its food by `food_id`, or by the user's words in `text`, which are matched
        to a food (`needs_confirmation` lists any that aren't sure, with candidates: confirm with
        PATCH /v1/meal-items/{id}). An item that names no food gives its `nutrients` instead ("lunch,
        about 600 calories"). Without an `amount`, the food's default portion is assumed and listed
        in `estimates`; a food without one isn't weighed. An item's nutrients are counted only once
        its food is confirmed, so `totals` may be a lower bound (`is_complete: false`). Without
        `eaten_at` or `date`, the meal is now. Needs health-data consent.

        An app syncing its own records sends each one's `external_id`: the same app sending it again
        gets the stored meal back (200, `Idempotent-Replayed`) whatever its Idempotency-Key, and
        one the person deleted is `not_found` and stays deleted.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MealInput"}
      responses:
        "201":
          description: Logged.
          headers:
            Location: {schema: {type: string}, description: The meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "200":
          description: An earlier request with the same Idempotency-Key; nothing new was stored.
          headers:
            Idempotent-Replayed: {$ref: "#/components/headers/IdempotentReplayed"}
            Location: {schema: {type: string}, description: The meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound", description: "`not_found`: a meal with this `external_id` was deleted, and stays deleted."}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/meals/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getMeal
      summary: One meal
      description: An Open Food Log meal, with its totals unless the person asked not to see numbers.
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The meal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
    patch:
      operationId: updateMeal
      summary: Change a meal's time, day, type, title or notes
      description: A field sent as null is cleared; a meal keeps a time or a day. Needs health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MealPatch"}
      responses:
        "200":
          description: The meal after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      operationId: deleteMeal
      summary: Delete a meal
      description: Restorable for a while with POST /v1/meals/{id}/restore. A server may ask for no consent to delete.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealDeleted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/meals/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: restoreMeal
      summary: Restore a deleted meal
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      responses:
        "200":
          description: The meal, back.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable", description: "`undo_unavailable`: not deleted, or deleted too long ago."}
        "429": {$ref: "#/components/responses/RateLimited"}
      description: Undoes a delete within the time the server keeps it; after that, `undo_unavailable`.
  /v1/meals/{id}/items:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: addMealItems
      summary: Add items to a meal
      description: Items as POST /v1/meals takes them. Needs health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MealItemsInput"}
      responses:
        "201":
          description: Added.
          headers:
            Location: {schema: {type: string}, description: The meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "200":
          description: An earlier request with the same Idempotency-Key; nothing new was stored.
          headers:
            Idempotent-Replayed: {$ref: "#/components/headers/IdempotentReplayed"}
            Location: {schema: {type: string}, description: The meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/meals/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: copyMeal
      summary: Log a meal again
      description: |
        "The same as yesterday's lunch": a new meal with the same items (their words, foods and
        amounts), each counted again from its food as it is now, on the day or time given (today when
        none is). An item whose food wasn't confirmed is matched again from its words. Needs
        health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LogAgainInput"}
      responses:
        "201":
          description: Logged.
          headers:
            Location: {schema: {type: string}, description: The new meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "200":
          description: An earlier request with the same Idempotency-Key; nothing new was stored.
          headers:
            Idempotent-Replayed: {$ref: "#/components/headers/IdempotentReplayed"}
            Location: {schema: {type: string}, description: The meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/recipes:
    get:
      operationId: listRecipes
      summary: The user's recipes
      description: Open Food Log recipes, by name.
      tags: [Foods]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The recipes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecipeList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      operationId: createRecipe
      summary: Make a recipe
      description: |
        A food made of other foods (OFL section 8). Each line is matched and weighed as a meal item
        is, and must name its food surely or give its own nutrients. Its nutrients are its lines'
        over its yield: `yield_g`, else the lines' grams times `cooking_yield_factor`, else the
        lines' grams; a nutrient one line lacks is left out. It is then one of the person's foods: a
        meal item names it by its `id`, by weight or in `serving`s.
      tags: [Foods]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipeInput"}
      responses:
        "201":
          description: Made.
          headers:
            Location: {schema: {type: string}, description: The recipe's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recipe"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/recipes/{id}:
    parameters:
      - {name: id, in: path, required: true, description: "The recipe's ID (recipe:…).", schema: {type: string}}
    get:
      operationId: getRecipe
      summary: One recipe
      tags: [Foods]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recipe"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      operationId: replaceRecipe
      summary: Replace a recipe
      description: Its name, lines and the rest, as POST /v1/recipes takes them; its ID stays, so meals and saved meals naming it still do. Meals already logged keep what they counted.
      tags: [Foods]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecipeInput"}
      responses:
        "200":
          description: The recipe after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Recipe"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      operationId: deleteRecipe
      summary: Delete a recipe
      description: Meals that logged it keep its name and what they counted; a saved meal naming it is matched from its words when next logged.
      tags: [Foods]
      security: [{oauth2: ['meals:write']}]
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/saved-meals:
    get:
      operationId: listSavedMeals
      summary: The user's saved meals
      description: Open Food Log saved meals, by name. Their items' grams and nutrients are left out when the person asked not to see numbers.
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The saved meals.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavedMealList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    post:
      operationId: createSavedMeal
      summary: Save a meal to log again
      description: |
        A meal the person keeps to log again ("my usual breakfast"): its items, as POST /v1/meals
        takes them, or a logged meal's (`from_meal_id`), kept as they were logged. A sentence naming
        it by name logs its items. Names are one per person. Needs health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavedMealInput"}
      responses:
        "201":
          description: Saved.
          headers:
            Location: {schema: {type: string}, description: The saved meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavedMeal"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/saved-meals/{id}:
    parameters:
      - {name: id, in: path, required: true, description: "The saved meal's ID (saved:…).", schema: {type: string}}
    get:
      operationId: getSavedMeal
      summary: One saved meal
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The saved meal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavedMeal"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      operationId: replaceSavedMeal
      summary: Replace a saved meal
      description: Its name, items and the rest, as POST /v1/saved-meals takes them; its ID stays. Needs health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavedMealInput"}
      responses:
        "200":
          description: The saved meal after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavedMeal"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      operationId: deleteSavedMeal
      summary: Delete a saved meal
      description: Meals logged from it stay. No consent needed.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/saved-meals/{id}/log:
    parameters:
      - {name: id, in: path, required: true, description: "The saved meal's ID (saved:…).", schema: {type: string}}
    post:
      operationId: logSavedMeal
      summary: Log a saved meal
      description: |
        A new meal titled with the saved meal's name, of its type unless another is given, each item
        counted again from its food as it is now (OFL section 8); an amount the saved meal marks as
        estimated stays marked. Needs health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LogAgainInput"}
      responses:
        "201":
          description: Logged.
          headers:
            Location: {schema: {type: string}, description: The new meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "200":
          description: An earlier request with the same Idempotency-Key; nothing new was stored.
          headers:
            Idempotent-Replayed: {$ref: "#/components/headers/IdempotentReplayed"}
            Location: {schema: {type: string}, description: The meal's URL.}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/meal-items/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateMealItem
      summary: Confirm an item's food, weigh it again, or change its notes
      description: |
        `food_id` confirms the food and teaches the user's words for it (GET /v1/food-phrases); the
        item is then weighed and counted. `amount` replaces the measure, and the item is no longer an
        estimate. `nutrients` is for an item that names no food. Needs health-data consent.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MealItemPatch"}
      responses:
        "200":
          description: The item's meal after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      operationId: deleteMealItem
      summary: Remove an item from its meal
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      responses:
        "200":
          description: The item's meal after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MealWritten"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/targets:
    get:
      operationId: getTargets
      summary: The user's nutrition targets
      description: |
        The user's own targets, current and past, as an Open Food Log targets document
        (https://openfoodlog.org/schema/v0/targets.json). Hiding numbers from the person doesn't
        hide them: they're the person's settings, and what's hidden is progress against them
        (`GET /v1/nutrition/summary`). `updated_at` is the latest change to any target, absent when
        there are none.
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The targets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Targets"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
    put:
      operationId: setTargets
      summary: Replace the user's nutrition targets
      description: |
        Replaces the whole list, in order (a server may cap its length). An entry
        with an `id` keeps it and must be one of the user's targets; one without gets a new one;
        targets left out are removed, so to change a target from some day on, end the old one with
        `effective_to` and add a new one. `effective_from` defaults to today in the user's timezone
        and `set_by` to `person`. `$schema`, `ofl_version` and `updated_at` are accepted, so a read
        can be sent back, and ignored. A server may ask for consent before storing health data.
      tags: [Meals]
      security: [{oauth2: ['meals:write']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TargetsInput"}
      responses:
        "200":
          description: The targets as saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Targets"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/nutrition/summary:
    get:
      operationId: getNutritionSummary
      summary: Totals per day and how each target went
      description: |
        Each day's totals from `from` to `to` (inclusive, in the user's timezone; `to` defaults to
        today and `from` to the six days before it; a server may limit the span), each target that applied to the day or to one of its meals with its status, per
        target how many days or meals it applied to and was met, and the days at target: those
        where every target that applied was met.

        A status is `met`, `under`, `above` or `unknown`, as Open Food Log section 9 judges it: a
        `min` is met at or past it, a `max` up to it, and a lone `target` within
        `tolerance_percent` (10 by default) either way. A total is a lower bound when something
        logged lacks the nutrient, no meal was logged, or the day isn't over (today): such a total
        is never `under`, and is `unknown` where what's missing could change the answer. When
        several targets apply, the one for some weekdays wins, then one for a meal type, then the
        latest `effective_from`, then the later entry.

        When the person asked not to see numbers it holds none:
        `calm_mode` is true and each day has only its date and meal count.
      tags: [Meals]
      security: [{oauth2: ['meals:read']}]
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NutritionSummary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /v1/foods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: "A food ID, e.g. `ofc:bananas-raw`, or one of the user's `usr:` foods."
        schema: {type: string}
    get:
      operationId: getFood
      summary: One food
      description: |
        A catalogue food with its portions, aliases and sources, or one of the user's own. A retired
        catalogue food is still returned, since meals may name it.
      tags: [Foods]
      security: [{oauth2: ['meals:read']}]
      responses:
        "200":
          description: The food.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Food"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503":
          description: "`barcode_unavailable`: a barcode couldn't be looked up just now. `Retry-After` says when to try again."
          headers:
            Retry-After: {schema: {type: integer}}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/RateLimited"}
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Any unique string, up to 200 characters. Retrying with the same key never writes twice.
      schema: {type: string, maxLength: 200}
  headers:
    IdempotentReplayed:
      description: "`true` when the response replays an earlier request with the same Idempotency-Key."
      schema: {type: string, enum: ["true"]}
    RetryAfter:
      description: Seconds to wait.
      schema: {type: integer}
  responses:
    BadRequest:
      description: "`invalid_input`: `field` names what to fix."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: Missing, invalid or expired token, or the account no longer exists.
      headers:
        WWW-Authenticate:
          description: Points at the protected resource metadata.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BearerError"}
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: |
        The token lacks the scope (a bearer error), or the user hasn't given health-data consent
        (`consent_required`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BearerError"}
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: "`not_found`: no such resource in this account."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unprocessable:
      description: "`idempotency_conflict`, or `undo_unavailable` where an operation says so."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: "`rate_limited`."
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          enum: [invalid_input, consent_required, not_found, undo_unavailable, rate_limited, idempotency_conflict, unauthenticated, internal_error, barcode_unavailable]
        field: {type: string, description: For invalid_input.}
    BearerError:
      type: object
      required: [error]
      properties:
        error: {enum: [invalid_request, invalid_token, insufficient_scope, server_error]}
        error_description: {type: string}
    MealWebhookInput:
      type: object
      required: [url, events]
      properties:
        url: {type: string, maxLength: 2048, description: "An https URL on a public host, with no credentials. Checked again on every delivery, on the address actually reached."}
        events:
          type: array
          minItems: 1
          items: {type: string, enum: [meal.created, meal.updated, meal.deleted]}
    MealWebhook:
      type: object
      required: [id, url, events, created_at, consecutive_failures]
      properties:
        id: {type: string}
        url: {type: string}
        events:
          type: array
          items: {type: string, enum: [meal.created, meal.updated, meal.deleted]}
        created_at: {type: string, format: date-time}
        paused_at: {type: string, format: date-time, description: Set after ten failed deliveries in a row. Nothing is delivered until the app subscribes again.}
        last_delivered_at: {type: string, format: date-time}
        last_status: {type: integer, description: "The endpoint's last HTTP status; 0 when it couldn't be reached."}
        consecutive_failures: {type: integer}
        secret: {type: string, description: "Only in the creation response: the key the deliveries are signed with. `OFL-Signature` is `t=<unix seconds>,v1=<hex HMAC-SHA256 of \"<t>.<body>\">`."}
    MealWebhookList:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items: {$ref: "#/components/schemas/MealWebhook"}
    OFLExport:
      description: The log as the Open Food Log core promises it, an OFL v0 log document (https://openfoodlog.org/schema/v0/log.json). A server may add more of the person's record beside its keys.
      type: object
      required: [exported_at, meals]
      properties:
        $schema: {type: string, const: "https://openfoodlog.org/schema/v0/log.json"}
        exported_at: {type: string, format: date-time}
        meals:
          description: Every meal in the log, newest first.
          type: array
          items: {$ref: "#/components/schemas/Meal"}
        foods:
          description: The person's own foods that the meals name, so a reader elsewhere can resolve them.
          type: array
          items: {$ref: "#/components/schemas/Food"}
        recipes:
          description: The person's recipes, which the meals and saved meals may name.
          type: array
          items: {$ref: "#/components/schemas/Recipe"}
        saved_meals:
          description: Meals the person keeps to log again (OFL v0.2).
          type: array
          items: {$ref: "#/components/schemas/SavedMeal"}
        deleted_meals:
          description: Meals the person deleted, newest first, for a server that keeps them.
          type: array
          items:
            type: object
            required: [deleted_at, meal]
            properties:
              deleted_at: {type: string, format: date-time}
              meal: {$ref: "#/components/schemas/Meal"}
    FoodAmount:
      description: "How much, in the measure the person used (OFL v0.1 section 6). Cups and spoons are portions; serving is the food's declared label serving."
      type: object
      required: [value, unit]
      properties:
        value: {type: number, exclusiveMinimum: 0}
        unit: {type: string, enum: [g, kg, oz, lb, ml, l, fl_oz, portion, serving]}
        portion: {type: string, description: With unit portion, the id of one of the food's portions.: ''}
    LogAgainInput:
      description: When a meal logged again was eaten, all optional; today when nothing is given.
      type: object
      properties:
        date: {type: string, format: date, description: "The user's local day."}
        eaten_at: {type: string, format: date-time}
        timezone: {type: string, description: The IANA zone the person ate in.}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack], description: "The meal's type; the one it had when left out."}
    FoodLine:
      description: An ingredient of a recipe, or an item of a saved meal, shaped like an Open Food Log meal item without an ID.
      type: object
      required: [text, food]
      properties:
        text: {type: string}
        food:
          type: object
          required: [id, name, match]
          properties:
            id: {type: [string, "null"]}
            name: {type: string}
            match: {type: string, enum: [catalogue, close, custom, unmatched, none]}
        amount: {$ref: "#/components/schemas/FoodAmount"}
        share: {type: number, exclusiveMinimum: 0, maximum: 1}
        grams: {type: number, minimum: 0}
        nutrients: {$ref: "#/components/schemas/FoodNutrients"}
        notes: {type: string}
    RecipeInput:
      type: object
      required: [name, lines, servings]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        lines: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/MealItemInput"}, description: "The ingredients, raw as they go in, each as a meal item."}
        servings: {type: number, exclusiveMinimum: 0, maximum: 1000, description: How many servings the whole makes.}
        yield_g: {type: number, exclusiveMinimum: 0, maximum: 100000, description: "What the whole weighs made. Needed when a line has no weight (a volume of a food with no density)."}
        cooking_yield_factor: {type: number, exclusiveMinimum: 0, maximum: 5, description: "Made weight over raw weight (0.75 for a roast that loses a quarter), used when yield_g is absent."}
        instructions: {type: string, maxLength: 10000}
        notes: {type: string, maxLength: 2000}
    Recipe:
      description: An Open Food Log v0.2 recipe (https://openfoodlog.org/schema/v0/recipe.json).
      type: object
      required: [$schema, ofl_version, id, name, lines, servings, nutrients_per_100g, nutrients_per_serving, source, updated_at]
      properties:
        $schema: {type: string, const: "https://openfoodlog.org/schema/v0/recipe.json"}
        ofl_version: {type: string}
        id: {type: string, description: "recipe:…, the food_id a meal item names it by."}
        name: {type: string}
        notes: {type: string}
        instructions: {type: string}
        lines: {type: array, items: {$ref: "#/components/schemas/FoodLine"}}
        servings: {type: number}
        yield_g: {type: number}
        cooking_yield_factor: {type: number}
        nutrients_per_100g: {$ref: "#/components/schemas/FoodNutrients"}
        nutrients_per_serving: {$ref: "#/components/schemas/FoodNutrients"}
        source:
          type: object
          required: [kind, external_id]
          properties:
            kind: {type: string, enum: [app, mcp, api, import]}
            client: {type: string}
            external_id: {type: [string, "null"]}
        updated_at: {type: string, format: date-time}
    RecipeList:
      type: object
      required: [recipes]
      properties:
        recipes: {type: array, items: {$ref: "#/components/schemas/Recipe"}}
    SavedMealInput:
      description: Give items, or from_meal_id, not both.
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: "What the person calls it (\"usual breakfast\"); a sentence naming it logs it."}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack], description: "The type to log it as; with from_meal_id, that meal's when left out."}
        label: {type: string, minLength: 1, maxLength: 80}
        notes: {type: string, maxLength: 2000}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/MealItemInput"}}
        estimates:
          type: array
          description: "As on POST /v1/meals: items whose amount the person didn't give."
          items: {type: string, pattern: "^/items/[0-9]+/(amount|grams|nutrients)$"}
        from_meal_id: {type: string, format: uuid, description: "A logged meal to save, its items as they were logged."}
    SavedMeal:
      description: An Open Food Log v0.2 saved meal (https://openfoodlog.org/schema/v0/saved-meal.json).
      type: object
      required: [$schema, ofl_version, id, name, items, source, updated_at, estimates]
      properties:
        $schema: {type: string, const: "https://openfoodlog.org/schema/v0/saved-meal.json"}
        ofl_version: {type: string, description: "0.2: saved meals arrived then."}
        id: {type: string, description: "saved:…"}
        name: {type: string}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack]}
        label: {type: string}
        notes: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/FoodLine"}, description: "grams and nutrients are what each counted when saved, a preview; logging counts again."}
        source:
          type: object
          required: [kind, external_id]
          properties:
            kind: {type: string, enum: [app, mcp, api, import]}
            client: {type: string}
            external_id: {type: [string, "null"]}
        updated_at: {type: string, format: date-time}
        estimates: {type: array, items: {type: string}}
    SavedMealList:
      type: object
      required: [saved_meals]
      properties:
        saved_meals: {type: array, items: {$ref: "#/components/schemas/SavedMeal"}}
    MealItemInput:
      type: object
      required: [text]
      properties:
        text: {type: string, maxLength: 200, description: "What the person called it. May be left empty with a food_id."}
        food_id: {type: string, description: "A food from GET /v1/foods."}
        amount: {$ref: "#/components/schemas/FoodAmount"}
        nutrients: {$ref: "#/components/schemas/FoodNutrients", description: For an item that names no food only.}
        share: {type: number, exclusiveMinimum: 0, maximum: 1, description: "For a dish shared with others, the person's part of amount (0.25 for a quarter); grams and nutrients are then their part. Not with nutrients."}
        confidence: {type: number, minimum: 0, maximum: 1, description: "How sure the producer is of the item, as a photo or model reports it. It doesn't replace estimates."}
        notes: {type: string, maxLength: 2000}
    MealInput:
      type: object
      required: [items]
      properties:
        eaten_at: {type: string, format: date-time}
        date: {type: string, format: date, description: "The user's local day, when there's no time; with eaten_at, it must be that time's day."}
        timezone: {type: string, description: "The IANA zone the person ate in (America/Chicago), which decides eaten_at's day. The user's own when left out."}
        logged_at: {type: string, format: date-time, description: "When the meal was recorded, for one logged elsewhere first. Now when left out."}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack]}
        label: {type: string, minLength: 1, maxLength: 80, description: "The person's own name for the occasion (second breakfast, iftar), beside or instead of meal_type."}
        title: {type: string, maxLength: 200}
        notes: {type: string, maxLength: 2000}
        recorded_by: {type: string, enum: [person, professional, app], description: "Who recorded it: the person (the default), a professional on their behalf, or an app on its own."}
        external_id: {type: string, description: The meal's ID in the app it came from.}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/MealItemInput"}}
        estimates:
          type: array
          description: |
            JSON pointers, as in an Open Food Log meal, to item values the person didn't give:
            `/items/{index}/amount` (or its `grams` or `nutrients`) stores that item's amount, and what
            is counted from it, as estimated. A draft's `meal` lists the amounts it assumed or read
            from a photo; drop an item's pointer when the person gives its amount.
          items: {type: string, pattern: "^/items/[0-9]+/(amount|grams|nutrients)$"}
    MealItemsInput:
      type: object
      required: [items]
      properties:
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/MealItemInput"}}
    MealPatch:
      type: object
      properties:
        eaten_at: {type: [string, "null"], format: date-time}
        date: {type: [string, "null"], format: date}
        timezone: {type: [string, "null"], description: "With eaten_at or date: the zone that decides the day. The user's own when null or left out; the meal takes it."}
        meal_type: {type: [string, "null"], enum: [breakfast, lunch, dinner, snack, null]}
        label: {type: [string, "null"], maxLength: 80}
        title: {type: [string, "null"]}
        notes: {type: [string, "null"]}
        recorded_by: {type: [string, "null"], enum: [person, professional, app, null]}
    MealItemPatch:
      type: object
      properties:
        food_id: {type: [string, "null"]}
        amount:
          oneOf:
            - {$ref: "#/components/schemas/FoodAmount"}
            - {type: "null"}
        share: {type: [number, "null"], exclusiveMinimum: 0, maximum: 1, description: "The person's part of a shared dish; null for all of it."}
        nutrients:
          oneOf:
            - {$ref: "#/components/schemas/FoodNutrients"}
            - {type: "null"}
        confidence: {type: [number, "null"], minimum: 0, maximum: 1}
        notes: {type: [string, "null"]}
    Meal:
      description: An Open Food Log v0.2 meal (https://openfoodlog.org/schema/v0/meal.json).
      type: object
      required: [$schema, ofl_version, id, date, logged_at, updated_at, source, items, estimates]
      properties:
        $schema: {type: string, const: "https://openfoodlog.org/schema/v0/meal.json"}
        ofl_version: {type: string, description: "The Open Food Log version, as MAJOR.MINOR: 0.2."}
        id: {type: string, format: uuid}
        eaten_at: {type: string, format: date-time}
        date: {type: string, format: date}
        timezone: {type: string, description: "The IANA zone the person ate in. Absent for meals logged before 2026-11-12."}
        logged_at: {type: string, format: date-time, description: When it was recorded.}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack]}
        label: {type: string, description: "The person's own name for the occasion."}
        title: {type: string}
        notes: {type: string}
        recorded_by: {type: string, enum: [person, professional, app], description: Absent means the person.}
        updated_at: {type: string, format: date-time}
        source:
          type: object
          required: [kind, external_id]
          properties:
            kind: {type: string, enum: [app, mcp, api, import]}
            client: {type: string}
            external_id: {type: [string, "null"]}
        items: {type: array, items: {$ref: "#/components/schemas/MealItem"}}
        estimates: {type: array, items: {type: string}, description: JSON pointers to values assumed rather than given.}
    MealItem:
      type: object
      required: [id, text, food]
      properties:
        id: {type: string, format: uuid, description: "Edit it with PATCH /v1/meal-items/{id}."}
        text: {type: string}
        food:
          type: object
          required: [id, name, match]
          properties:
            id: {type: [string, "null"]}
            name: {type: string}
            match: {type: string, enum: [catalogue, close, custom, unmatched, none], description: "catalogue and custom are confirmed; close and unmatched need confirming; none names no food."}
        amount: {$ref: "#/components/schemas/FoodAmount"}
        share: {type: number, exclusiveMinimum: 0, maximum: 1, description: "The person's part of a shared dish: amount is the whole, grams and nutrients their part."}
        grams: {type: number, minimum: 0, description: "Absent when the amount can't be weighed: a drink known per 100 ml, a supplement known per serving."}
        nutrients: {$ref: "#/components/schemas/FoodNutrients", description: As counted when logged; absent until the food is confirmed or when it couldn't be counted.}
        confidence: {type: number, minimum: 0, maximum: 1}
        notes: {type: string}
    MealTotals:
      description: The items' nutrients added up. is_complete is false when an item has none, so they're a lower bound.
      type: object
      required: [nutrients, is_complete]
      properties:
        nutrients: {$ref: "#/components/schemas/FoodNutrients"}
        is_complete: {type: boolean}
    MealWritten:
      type: object
      required: [meal, needs_confirmation]
      properties:
        meal: {$ref: "#/components/schemas/Meal"}
        needs_confirmation:
          type: array
          items:
            type: object
            required: [item_id, text, candidates]
            properties:
              item_id: {type: string, format: uuid}
              text: {type: string}
              candidates: {type: array, items: {$ref: "#/components/schemas/FoodMatch"}}
        totals: {$ref: "#/components/schemas/MealTotals", description: "Left out when the person asked not to see numbers."}
    MealList:
      type: object
      required: [meals]
      properties:
        meals: {type: array, items: {$ref: "#/components/schemas/Meal"}}
        days:
          description: Each day's totals; left out when the person asked not to see numbers.
          type: array
          items:
            type: object
            required: [date, totals]
            properties:
              date: {type: string, format: date}
              totals: {$ref: "#/components/schemas/MealTotals"}
        updated_since: {type: string, format: date-time, description: "The change feed's: the time asked about."}
        deleted:
          description: "The change feed's, with `include_deleted`: meals deleted since then."
          type: array
          items: {$ref: "#/components/schemas/MealTombstone"}
        truncated: {type: boolean, description: "The change feed's: more changes follow; pass `next_cursor`."}
        next_cursor: {type: string}
    MealTombstone:
      type: object
      description: A deleted meal in the change feed, enough to remove a mirror's copy and nothing of what it held.
      required: [id, deleted_at, updated_at]
      properties:
        id: {type: string}
        deleted_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MealDeleted:
      type: object
      required: [deleted_at, restore_until]
      properties:
        deleted_at: {type: string, format: date-time}
        restore_until: {type: string, format: date-time}
    Target:
      description: One target of an Open Food Log targets document (https://openfoodlog.org/schema/v0/targets.json).
      type: object
      required: [nutrient, per, effective_from, set_by]
      properties:
        id: {type: string, format: uuid, description: Assigned by the server; send it back to keep the target.}
        nutrient: {type: string, description: "A nutrient key, as in `FoodNutrients`."}
        per: {type: string, enum: [day, meal], description: "day: the total of the user's local day. meal: each meal on its own."}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack], description: "With `per: meal`, only meals of this type; absent means every meal."}
        min: {type: number, minimum: 0, description: At least this much, in the nutrient's unit.: ''}
        max: {type: number, minimum: 0, description: At most this much.}
        target: {type: number, minimum: 0, description: "About this much. Alone, it's met within `tolerance_percent` either way; with `min` or `max`, those decide."}
        tolerance_percent: {type: number, minimum: 0, maximum: 100, description: "For a lone `target`: how far either side still counts as met; 10 when absent."}
        weekdays:
          description: ISO weekdays it applies on, 1 Monday to 7 Sunday; absent means every day.
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 7}
        effective_from: {type: string, format: date, description: The first local day it applies.}
        effective_to: {type: string, format: date, description: The last local day it applies; absent means until replaced.}
        set_by: {type: string, enum: [person, professional, app_suggestion]}
        note: {type: string, maxLength: 2000}
    TargetInput:
      description: A target to save; `effective_from` defaults to today and `set_by` to `person`.
      type: object
      required: [nutrient, per]
      anyOf: [{required: [min]}, {required: [max]}, {required: [target]}]
      properties:
        id: {type: string, format: uuid, description: Assigned by the server; send it back to keep the target.}
        nutrient: {type: string, description: "A nutrient key, as in `FoodNutrients`."}
        per: {type: string, enum: [day, meal], description: "day: the total of the user's local day. meal: each meal on its own."}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack], description: "With `per: meal`, only meals of this type; absent means every meal."}
        min: {type: number, minimum: 0, description: At least this much, in the nutrient's unit.: ''}
        max: {type: number, minimum: 0, description: At most this much.}
        target: {type: number, minimum: 0, description: "About this much. Alone, it's met within `tolerance_percent` either way; with `min` or `max`, those decide."}
        tolerance_percent: {type: number, minimum: 0, maximum: 100, description: "For a lone `target`: how far either side still counts as met; 10 when absent."}
        weekdays:
          description: ISO weekdays it applies on, 1 Monday to 7 Sunday; absent means every day.
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 7}
        effective_from: {type: string, format: date, description: The first local day it applies.}
        effective_to: {type: string, format: date, description: The last local day it applies; absent means until replaced.}
        set_by: {type: string, enum: [person, professional, app_suggestion]}
        note: {type: string, maxLength: 2000}
    Targets:
      description: An Open Food Log targets document (https://openfoodlog.org/schema/v0/targets.json).
      type: object
      required: [$schema, ofl_version, targets]
      properties:
        $schema: {type: string, const: "https://openfoodlog.org/schema/v0/targets.json"}
        ofl_version: {type: string, const: "0.2"}
        updated_at: {type: string, format: date-time}
        targets: {type: array, items: {$ref: "#/components/schemas/Target"}}
    TargetsInput:
      type: object
      required: [targets]
      additionalProperties: false
      properties:
        $schema: {type: string}
        ofl_version: {type: string}
        updated_at: {type: string, format: date-time}
        targets:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/TargetInput"}
    TargetProgress:
      description: One target against a day's or a meal's total of its nutrient.
      type: object
      required: [target_id, nutrient, per, is_complete, status]
      properties:
        target_id: {type: string, format: uuid}
        nutrient: {type: string}
        per: {type: string, enum: [day, meal]}
        meal_id: {type: string, format: uuid, description: "For `per: meal`."}
        meal_type: {type: string, enum: [breakfast, lunch, dinner, snack]}
        total: {type: number, description: Absent when nothing logged has the nutrient.}
        is_complete: {type: boolean, description: "False when something logged lacks the nutrient, no meal was logged, or the day isn't over: `total` is a lower bound."}
        status: {type: string, enum: [met, under, above, unknown]}
    NutritionSummary:
      type: object
      required: [from, to, calm_mode, days]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        calm_mode: {type: boolean, description: "When true, the person asked not to see numbers, so the summary holds no numbers but meal counts."}
        days:
          description: Every day from `from` to `to`, earliest first.
          type: array
          items:
            type: object
            required: [date, meal_count]
            properties:
              date: {type: string, format: date}
              meal_count: {type: integer, minimum: 0}
              totals: {$ref: "#/components/schemas/MealTotals", description: Absent with no meals or when calm_mode is true.}
              targets: {type: array, items: {$ref: "#/components/schemas/TargetProgress"}, description: The day targets that applied.}
              meal_targets: {type: array, items: {$ref: "#/components/schemas/TargetProgress"}, description: The meal targets that applied, per meal.: ''}
              is_at_target: {type: boolean, description: Every target that applied was met; absent when none applied.}
              is_underway: {type: boolean, description: "The day isn't over (today, in the user's timezone): its totals are lower bounds."}
        targets:
          description: Per target, how many days (per day) or meals (per meal) it applied to and was met. Absent when calm_mode is true.
          type: array
          items:
            type: object
            required: [target_id, nutrient, per, applied, met]
            properties:
              target_id: {type: string, format: uuid}
              nutrient: {type: string}
              per: {type: string, enum: [day, meal]}
              applied: {type: integer, minimum: 0}
              met: {type: integer, minimum: 0}
        days_at_target: {type: integer, minimum: 0, description: Days where every target that applied was met. Absent when calm_mode is true.}
    FoodNutrients:
      description: Amounts keyed by nutrient, each in the unit its key ends in (https://openfoodlog.org/nutrients/). A key left out is unknown, never zero.
      type: object
      additionalProperties: false
      properties:
        energy_kcal: {type: number, minimum: 0}
        energy_kj: {type: number, minimum: 0}
        protein_g: {type: number, minimum: 0}
        fat_g: {type: number, minimum: 0}
        saturated_fat_g: {type: number, minimum: 0}
        monounsaturated_fat_g: {type: number, minimum: 0}
        polyunsaturated_fat_g: {type: number, minimum: 0}
        trans_fat_g: {type: number, minimum: 0}
        ala_g: {type: number, minimum: 0}
        epa_g: {type: number, minimum: 0}
        dha_g: {type: number, minimum: 0}
        cholesterol_mg: {type: number, minimum: 0}
        carbohydrate_g: {type: number, minimum: 0}
        carbohydrate_available_g: {type: number, minimum: 0}
        fiber_g: {type: number, minimum: 0}
        sugars_g: {type: number, minimum: 0}
        added_sugars_g: {type: number, minimum: 0}
        starch_g: {type: number, minimum: 0}
        polyols_g: {type: number, minimum: 0}
        sodium_mg: {type: number, minimum: 0}
        salt_g: {type: number, minimum: 0}
        potassium_mg: {type: number, minimum: 0}
        calcium_mg: {type: number, minimum: 0}
        iron_mg: {type: number, minimum: 0}
        magnesium_mg: {type: number, minimum: 0}
        phosphorus_mg: {type: number, minimum: 0}
        zinc_mg: {type: number, minimum: 0}
        copper_mg: {type: number, minimum: 0}
        manganese_mg: {type: number, minimum: 0}
        selenium_ug: {type: number, minimum: 0}
        iodine_ug: {type: number, minimum: 0}
        chromium_ug: {type: number, minimum: 0}
        molybdenum_ug: {type: number, minimum: 0}
        chloride_mg: {type: number, minimum: 0}
        vitamin_a_rae_ug: {type: number, minimum: 0}
        vitamin_c_mg: {type: number, minimum: 0}
        vitamin_d_ug: {type: number, minimum: 0}
        vitamin_e_mg: {type: number, minimum: 0}
        vitamin_k_ug: {type: number, minimum: 0}
        thiamin_mg: {type: number, minimum: 0}
        riboflavin_mg: {type: number, minimum: 0}
        niacin_mg: {type: number, minimum: 0}
        pantothenic_acid_mg: {type: number, minimum: 0}
        vitamin_b6_mg: {type: number, minimum: 0}
        biotin_ug: {type: number, minimum: 0}
        folate_dfe_ug: {type: number, minimum: 0}
        folic_acid_ug: {type: number, minimum: 0}
        vitamin_b12_ug: {type: number, minimum: 0}
        choline_mg: {type: number, minimum: 0}
        caffeine_mg: {type: number, minimum: 0}
        alcohol_g: {type: number, minimum: 0}
        water_g: {type: number, minimum: 0}
    FoodPortion:
      description: A named measure and what one weighs.
      type: object
      required: [label, grams]
      properties:
        id: {type: string, pattern: "^[a-z0-9-]+$", description: "Unique within the food; made from the label when left out."}
        label: {type: string, maxLength: 80, description: "What one of it is called: \"1 large\", \"1 bar\"."}
        grams: {type: number, exclusiveMinimum: 0, maximum: 5000}
        is_default: {type: boolean, description: The amount to assume when a person names the food without one. At most one.}
    Food:
      description: An Open Food Log v0.2 food (https://openfoodlog.org/schema/v0/food.json).
      type: object
      required: [id, name, kind, nutrients_per_100g]
      properties:
        ofl_version: {type: string, description: "On a food read alone (GET /v1/foods/{id}): the Open Food Log version, 0.2."}
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [generic, branded, custom], description: "branded: a packaged product."}
        brand: {type: string}
        gtin: {type: array, items: {type: string, pattern: "^[0-9]{14}$"}}
        aliases:
          type: array
          items:
            type: object
            required: [name, kind]
            properties:
              name: {type: string}
              kind: {type: string, enum: [common]}
        nutrients_basis:
          type: string
          enum: ["100g", "100ml", "serving"]
          description: "Which values the source declared: per 100 g (the default when left out), or per 100 ml for a drink, whose nutrients_per_100g is then {} and which is logged by volume or servings."
        nutrients_per_100g: {$ref: "#/components/schemas/FoodNutrients"}
        nutrients_per_100ml: {$ref: "#/components/schemas/FoodNutrients"}
        x-nutrients_per_100ml: {$ref: "#/components/schemas/FoodNutrients", deprecated: true, description: "Deprecated: nutrients_per_100ml. Sent beside it until the next release."}
        x-serving_ml: {type: number, exclusiveMinimum: 0, deprecated: true, description: "Deprecated: label.serving.ml. A drink's serving in millilitres, sent until the next release."}
        density_g_per_ml: {type: number, exclusiveMinimum: 0}
        portions:
          type: array
          items: {$ref: "#/components/schemas/FoodPortion"}
        label: {$ref: "#/components/schemas/FoodLabel"}
        category:
          type: object
          required: [name, basis]
          properties:
            name: {type: string}
            code: {type: string}
            scheme: {type: string, description: "fdc, gpc, off or a producer's own."}
            basis: {$ref: "#/components/schemas/AttributeBasis"}
        allergens:
          type: array
          description: "Allergens it contains or may contain. One not listed is unknown, never absent."
          items:
            type: object
            required: [allergen, presence, basis]
            properties:
              allergen: {type: string, enum: [gluten, wheat, crustaceans, molluscs, eggs, fish, peanuts, soybeans, milk, tree_nuts, celery, mustard, sesame, sulphites, lupin]}
              presence: {type: string, enum: [contains, may_contain]}
              basis: {$ref: "#/components/schemas/AttributeBasis"}
        diet_flags:
          type: array
          description: Diets it suits. A flag not listed is unknown.
          items:
            type: object
            required: [flag, basis]
            properties:
              flag: {type: string, description: "vegan, vegetarian, gluten_free, dairy_free, halal, kosher, organic, or x-<vendor>-<flag>."}
              certified_by: {type: string}
              basis: {$ref: "#/components/schemas/AttributeBasis"}
        ingredients_text:
          type: object
          required: [text, basis]
          properties:
            text: {type: string}
            locale: {type: string}
            basis: {$ref: "#/components/schemas/AttributeBasis"}
        glycemic_index:
          type: object
          required: [value, basis]
          properties:
            value: {type: number, minimum: 0}
            reference: {type: string, enum: [glucose, white_bread]}
            source: {type: string}
            basis: {$ref: "#/components/schemas/AttributeBasis"}
        glycemic_load:
          type: object
          required: [value, grams, basis]
          properties:
            value: {type: number, minimum: 0}
            grams: {type: number, exclusiveMinimum: 0}
            source: {type: string}
            basis: {$ref: "#/components/schemas/AttributeBasis"}
        identifiers:
          type: object
          properties:
            fdc_id: {type: integer, description: USDA FoodData Central's ID.}
            off_code: {type: string, description: "The Open Food Facts product code, for a gtin: food."}
        provenance:
          type: object
          required: [sources, review]
          properties:
            sources: {type: array, items: {type: object}}
            generated: {type: array, items: {type: string}, description: JSON pointers to values a model suggested.}
            review: {type: string, enum: [unreviewed, reviewed]}
    FoodLabel:
      description: "What a package's nutrition label declares, as printed. region decides what carbohydrate means: us and ca total (fibre included), eu, uk and au available (without it)."
      type: object
      required: [region]
      properties:
        region: {type: string, enum: [us, eu, uk, au, ca]}
        serving:
          type: object
          required: [text]
          properties:
            text: {type: string}
            grams: {type: number, exclusiveMinimum: 0}
            ml: {type: number, exclusiveMinimum: 0}
        servings_per_container: {type: number, exclusiveMinimum: 0}
        nutrients_per_serving: {$ref: "#/components/schemas/FoodNutrients"}
        percent_daily_values: {type: object, additionalProperties: {type: number, minimum: 0}}
    AttributeBasis:
      type: string
      enum: [declared, inferred]
      description: "declared: by the label, the maker or a database that measured it. inferred: worked out or guessed; never to be shown as a declaration."
    FoodMatch:
      type: object
      required: [id, name, kind, nutrients_per_100g, is_reviewed, score]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [generic, custom]}
        nutrients_per_100g: {$ref: "#/components/schemas/FoodNutrients"}
        is_reviewed: {type: boolean}
        score: {type: number, description: "1 for a whole name, 0.95 a whole alias, 0.9 a name that starts with the word, else similarity of spelling, at most 0.85."}
    FoodRequest:
      description: Give nutrients_per_100g, or nutrients_per_serving with serving.
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 120}
        nutrients_per_100g: {$ref: "#/components/schemas/FoodNutrients"}
        nutrients_per_serving: {$ref: "#/components/schemas/FoodNutrients"}
        serving: {$ref: "#/components/schemas/FoodPortion"}
        density_g_per_ml: {type: number, exclusiveMinimum: 0, maximum: 3}
        portions:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/FoodPortion"}
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.1 with PKCE (S256), at the server's own authorization server: find it from a 401
        (RFC 9728, then RFC 8414). Request tokens for the server's resource (RFC 8707).
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            meals:read: See meals and the user's own foods
            meals:write: Add and change meals and the user's own foods
