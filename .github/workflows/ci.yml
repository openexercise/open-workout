name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: The Go client, a module of its own
        working-directory: clients/go
        run: go vet ./... && go test ./...
      - name: The template MCP server, a module of its own
        working-directory: mcp/template
        run: go vet ./... && go test -race ./...
      - run: go run ./cmd/ows validate
      - run: go run ./cmd/ows site dist
  typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
