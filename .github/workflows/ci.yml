# Checks on pull requests and pushes to main (the Mighty portfolio GitHub standard, Section 5).
# This repository is public, so every job runs on GitHub-hosted runners, never the org's self-hosted
# ones: a fork's pull request would run its code there. The `required` job at the end is the one
# status check main's mighty-main ruleset requires; every other job goes in its needs.
name: CI

on:
  # Branches are checked by their pull request; a push trigger on every branch would report a second
  # `required` check, without the title and secret checks, for the same commit.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # runs on main finish

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: The Go client, a module of its own
        working-directory: clients/go
        run: go vet ./... && go test ./...
      - name: The template MCP server, a module of its own
        working-directory: mcp/template
        run: go vet ./... && go test -race ./...
      - run: go run ./cmd/ows validate
      - run: go run ./cmd/ows site dist
  typescript-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  partner-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: partner-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: mcp/template/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partner-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Builds and runs the template server, and runs the app against it.
      - run: npm test

  pr-title:
    name: PR title is a conventional commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "PR title must be 'type(scope): description' (it becomes the squash commit), got: $TITLE"
            exit 1
          fi

  # Scans only the pull request's own commits. GitHub's secret scanning and push protection also run
  # on this public repository; this catches a secret before it reaches main.
  secrets:
    name: No secrets (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # The binary, not gitleaks-action, which needs a paid licence for organization repositories.
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}" .

  required:
    name: required
    if: always()
    needs: [validate, typescript-client, partner-app, pr-title, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a required job ended: $r"; exit 1 ;; esac
          done
