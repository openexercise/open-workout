# Weekly dependency updates (the Mighty portfolio GitHub standard, Section 6). Minor and patch are
# grouped into one pull request per ecosystem; majors come separately.
version: 2

updates:
  - package-ecosystem: gomod
    directories: [/, /clients/go, /mcp/template]
    schedule: { interval: weekly, day: tuesday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      go-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directories: [/clients/ts, /partner-app]
    schedule: { interval: weekly, day: tuesday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: tuesday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { update-types: [major, minor, patch] }
